[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vec-logcheck"
version = "1.0.0"
description = "Heuristic raw-count versus log-normalized scale checker for VEC submission H5AD files."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "anndata>=0.10",
  "scipy>=1.10"
]
keywords = ["virtual-embryo", "h5ad", "quality-control", "normalization"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vec-logcheck = "vec_logcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
